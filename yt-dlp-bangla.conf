# yt-dlp config — Bangla defaults
# Original: https://github.com/yt-dlp/yt-dlp (feature-rich command-line audio/video downloader)
# Use with: yt-dlp --config-location yt-dlp-bangla.conf <URL>
# Or copy to ~/.config/yt-dlp/config to make it the default.

# Best video up to 1080p + best audio, fall back to best single file
--format bestvideo[height<=1080]+bestaudio/best[height<=1080]/best
--merge-output-format mp4

# Bangla + English subtitles when available, embedded in the file
--sub-langs bn,en
--embed-subs
--embed-metadata

# Save into ~/Downloads/yt-dlp with the video title as filename
--output ~/Downloads/yt-dlp/%(title)s.%(ext)s

# Keep original upload dates off the file (avoids weird timestamps)
--no-mtime
